name: Autograding - ASP.NET Core Lab 01

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  actions: read

jobs:
  autograding:
    name: Autograding
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ---------------------------------------------------------
      # 1. Tải mã nguồn
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Cài đặt các phiên bản .NET được phép sử dụng
      # ---------------------------------------------------------
      - name: Install supported .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # ---------------------------------------------------------
      # 3. Kiểm tra cấu trúc project: 1 điểm
      # ---------------------------------------------------------
      - name: Check project structure
        id: check-structure
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Check project structure
          setup-command: ''
          command: test -f "Lab01.Web/Lab01.Web.csproj"
          timeout: 1
          max-score: 1

      # ---------------------------------------------------------
      # 4. Khôi phục thư viện: 2 điểm
      # ---------------------------------------------------------
      - name: Restore dependencies
        id: restore
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Restore dependencies
          setup-command: ''
          command: dotnet restore "Lab01.Web/Lab01.Web.csproj"
          timeout: 5
          max-score: 2

      # ---------------------------------------------------------
      # 5. Biên dịch project: 3 điểm
      # ---------------------------------------------------------
      - name: Build application
        id: build
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Build application
          setup-command: ''
          command: dotnet build "Lab01.Web/Lab01.Web.csproj" --configuration Release --no-restore
          timeout: 5
          max-score: 3

      # ---------------------------------------------------------
      # 6. Khởi động và kiểm tra ứng dụng: 4 điểm
      # ---------------------------------------------------------
      - name: Run and test application
        id: run-application
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Run and test application
          setup-command: ''
          command: >-
            bash -c '
              dotnet run
              --project "Lab01.Web/Lab01.Web.csproj"
              --configuration Release
              --no-build
              --no-launch-profile
              --urls "http://127.0.0.1:5050"
              > application.log 2>&1 &

              APP_PID=$!;

              cleanup() {
                kill "$APP_PID" 2>/dev/null || true;
              };

              trap cleanup EXIT;

              for i in {1..30}; do
                if curl
                --silent
                --show-error
                "http://127.0.0.1:5050/"
                > /dev/null; then
                  echo "Application started successfully.";
                  exit 0;
                fi;

                if ! kill -0 "$APP_PID" 2>/dev/null; then
                  echo "Application stopped before responding.";
                  echo "----- Application log -----";
                  cat application.log;
                  exit 1;
                fi;

                sleep 1;
              done;

              echo "Application did not respond within 30 seconds.";
              echo "----- Application log -----";
              cat application.log;
              exit 1
            '
          timeout: 2
          max-score: 4

      # ---------------------------------------------------------
      # 7. Tổng hợp và gửi điểm về GitHub Classroom
      # ---------------------------------------------------------
      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        if: always()
        env:
          CHECK-STRUCTURE_RESULTS: "${{ steps.check-structure.outputs.result }}"
          RESTORE_RESULTS: "${{ steps.restore.outputs.result }}"
          BUILD_RESULTS: "${{ steps.build.outputs.result }}"
          RUN-APPLICATION_RESULTS: "${{ steps.run-application.outputs.result }}"
        with:
          runners: check-structure,restore,build,run-application
